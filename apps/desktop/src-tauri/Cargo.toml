# Tauri version 2 DECIDED per Telegram message 4070 dated 03/11/2026 (ZC Leader).
# Exact patch pinned per Telegram message 4086 dated 03/11/2026 (ZC Leader):
# Exact patch resolved 03/11/2026 by cargo generate-lockfile: 2.12.5.
# Bridge round (04/11/2026): main.rs wires the real Tauri Builder and the
# six commands are real handlers delegating to commands/registry.rs.
# serde is added for the command wire structs only; the backend still holds
# no model, no key, no network call. Full cargo check still needs the
# Leader VM (system libraries gdk-3.0 / webkit2gtk are missing on the seat
# box); registry.rs logic is test-verified standalone with rustc --test.
# CLI bridge round (Phase 2, tin 9530): serde_json parses the CLI
# stream-json records and libc sends SIGINT for the abort escalation.
# Both were already in Cargo.lock as transitive dependencies at the same
# versions, so the lockfile does not change.
[package]
name = "sen-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = "=2.12.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Tauri follow-up 1 (19/11): fresh UUID per MCP delegate call.
# Already in Cargo.lock as a transitive dependency (1.29.0, via
# tauri); adding it direct keeps the lockfile's version.
uuid = { version = "1", features = ["v4"] }
# P0-1: Telegram Bot API client (blocking, rustls). Version 0.12, not
# 0.13: 0.13 renamed the `rustls-tls` feature to `rustls` and needs
# `aws-lc-rs`, which is not in the local cargo cache; 0.12 uses ring,
# which is cached. The lockfile gains the 0.12 tree (Tauri already
# pulls reqwest 0.13.5 as a transitive dependency, so two majors
# coexist, which cargo allows).
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }

[build-dependencies]
tauri-build = "2"
